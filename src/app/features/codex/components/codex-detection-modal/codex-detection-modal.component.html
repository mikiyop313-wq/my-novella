<section class="codex-detection-modal overlay-modal" role="dialog" aria-modal="true"
  aria-labelledby="codex-detection-title">
  @if (currentEntry(); as entry) {
    <header class="modal-header">
      <div class="title-group">
        <div class="detection-label">
          <span class="eyebrow">AI detection</span>
          <span class="type-badge" [attr.data-type]="entry.type">{{ currentTypeLabel() }}</span>
        </div>
        <h2 id="codex-detection-title" [class]="entryAnimationClass()">{{ entry.name }}</h2>
      </div>
      <button type="button" class="icon-button close-button" aria-label="Close detected entries" (click)="close.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
      </button>
    </header>

    <div class="modal-body" [class]="entryAnimationClass()">
      <p>{{ entry.description }}</p>
    </div>

    @if (saveError(); as error) {
      <div class="save-error" role="alert">{{ error }}</div>
    }

    <footer class="modal-footer">
      <div class="entry-navigation">
        <button type="button" class="icon-button navigation-button" aria-label="Previous detected entry"
          [disabled]="saving() || currentIndex() === 0" (click)="previous()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <span class="entry-count" aria-live="polite">
          <strong>{{ currentIndex() + 1 }}</strong> / {{ entries().length }}
        </span>
        <button type="button" class="icon-button navigation-button" aria-label="Next detected entry"
          [disabled]="saving() || currentIndex() === entries().length - 1" (click)="next()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" class="action-button discard-button" [disabled]="saving()"
          (click)="discard()">Discard</button>
        <button type="button" class="action-button add-button" [disabled]="saving()" (click)="addToCodex()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          {{ saving() ? 'Adding...' : 'Add to Codex' }}
        </button>
      </div>
    </footer>
  }
</section>
