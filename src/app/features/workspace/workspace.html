<div class="workspace-shell" [class.sidebar-open]="store.sidebarOpen()">
  <header class="workspace-topbar">
    <div class="topbar-left">
      <button class="icon-btn" routerLink="/library" title="Back to library" aria-label="Back to library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </button>

      <div class="workspace-title">
        <span class="workspace-kicker">Book Workspace</span>
        <h1 [title]="store.bookTitle()">{{ store.bookTitle() }}</h1>
      </div>
    </div>

    @if (store.bookId(); as bookId) {
    <div class="topbar-center view-toggle" 
         [class.is-outline]="store.activeView() === 'outline'"
         [class.is-manuscript]="store.activeView() === 'manuscript'"
         [class.is-chat]="store.activeView() === 'chat'"
         [class.is-settings]="store.activeView() === 'settings'">
      <div class="active-pill"></div>
      <a [routerLink]="['/workspace', bookId, 'outline']" [class.is-active]="store.activeView() === 'outline'" class="view-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span>Outline</span>
      </a>
      <a [routerLink]="getManuscriptRoute(bookId)" [class.is-active]="store.activeView() === 'manuscript'" class="view-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        <span>Manuscript</span>
      </a>
      <a [routerLink]="getChatRoute(bookId)" [class.is-active]="store.activeView() === 'chat'" class="view-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Chat</span>
      </a>
    </div>
    } @else {
    <div class="topbar-center"></div>
    }

    <div class="topbar-right">
      @if (store.bookId(); as bookId) {
      <a
        class="icon-btn settings-button"
        [routerLink]="['/workspace', bookId, 'settings']"
        title="Book settings"
        aria-label="Open book settings"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </a>
      }
    </div>
  </header>

  <div class="workspace-body">
    <app-workspace-sidebar [class.is-open]="store.sidebarOpen()"></app-workspace-sidebar>

    <main class="workspace-content">
      <div class="animation-container" [@routeAnimations]="getRouteAnimationData()">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<ng-container [appOverlayModal]="codexDetectionModal"
  #codexDetectionModalTrigger="appOverlayModal"
  (closed)="onCodexDetectionModalClosed()"></ng-container>

<ng-template #codexDetectionModal let-closeModal>
  <app-codex-detection-modal [detectedEntries]="detectedCodexEntries()"
    [saveEntry]="saveDetectedCodexEntry"
    (close)="closeModal()"></app-codex-detection-modal>
</ng-template>
