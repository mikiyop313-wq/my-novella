<aside class="workspace-sidebar-panel" [class.is-collapsed]="!store.sidebarOpen()" aria-label="Workspace sidebar">
  <div class="sidebar-header">
    <div class="header-text" [class.hidden]="!store.sidebarOpen()">
      <span class="reference-label">Reference</span>
      <div class="reference-tabs" [class.notes-active]="activeSection() === 'notes'" role="tablist"
        aria-label="Reference section">
        <button id="codex-reference-tab" type="button" role="tab" aria-controls="codex-reference-panel"
          [attr.aria-selected]="activeSection() === 'codex'" [attr.tabindex]="activeSection() === 'codex' ? 0 : -1"
          [class.active]="activeSection() === 'codex'" (click)="selectSection('codex')"
          (keydown)="handleTabKeydown($event)">Codex</button>
        <button id="notes-reference-tab" type="button" role="tab" aria-controls="notes-reference-panel"
          [attr.aria-selected]="activeSection() === 'notes'" [attr.tabindex]="activeSection() === 'notes' ? 0 : -1"
          [class.active]="activeSection() === 'notes'" (click)="selectSection('notes')"
          (keydown)="handleTabKeydown($event)">Notes</button>
      </div>
    </div>

    <button class="close-btn" (click)="store.toggleSidebar()" [title]="store.sidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round" [style.transform]="store.sidebarOpen() ? 'rotate(0deg)' : 'rotate(180deg)'" style="transition: transform 0.3s ease;">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </button>
  </div>

  <div class="sidebar-sections">
    <app-codex-sidebar-section id="codex-reference-panel" class="sidebar-section-panel codex-panel" role="tabpanel"
      aria-labelledby="codex-reference-tab" [class.section-active]="activeSection() === 'codex'"
      [class.section-hidden]="activeSection() !== 'codex'" [attr.aria-hidden]="activeSection() !== 'codex'"
      [attr.inert]="activeSection() !== 'codex' ? '' : null"></app-codex-sidebar-section>
    <app-general-notes-sidebar-section id="notes-reference-panel" class="sidebar-section-panel notes-panel"
      role="tabpanel" aria-labelledby="notes-reference-tab" [class.section-active]="activeSection() === 'notes'"
      [class.section-hidden]="activeSection() !== 'notes'" [attr.aria-hidden]="activeSection() !== 'notes'"
      [attr.inert]="activeSection() !== 'notes' ? '' : null"></app-general-notes-sidebar-section>
  </div>
</aside>
