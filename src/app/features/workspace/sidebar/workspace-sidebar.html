<aside class="workspace-sidebar-panel" [class.is-collapsed]="!store.sidebarOpen()" aria-label="Workspace sidebar">
  <div class="sidebar-header">
    <div class="header-text" [class.hidden]="!store.sidebarOpen()">
      <span>Reference</span>
      <div class="reference-tabs" role="tablist" aria-label="Reference section">
        <button type="button" role="tab" [attr.aria-selected]="activeSection() === 'codex'"
          [class.active]="activeSection() === 'codex'" (click)="selectSection('codex')">Codex</button>
        <button type="button" role="tab" [attr.aria-selected]="activeSection() === 'notes'"
          [class.active]="activeSection() === 'notes'" (click)="selectSection('notes')">Notes</button>
      </div>
    </div>

    <button class="close-btn" (click)="store.toggleSidebar()" [title]="store.sidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round" [style.transform]="store.sidebarOpen() ? 'rotate(0deg)' : 'rotate(180deg)'" style="transition: transform 0.3s ease;">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </button>
  </div>

  <div class="sidebar-sections">
    <app-codex-sidebar-section [class.section-hidden]="activeSection() !== 'codex'"
      [attr.aria-hidden]="activeSection() !== 'codex'"></app-codex-sidebar-section>
    <app-general-notes-sidebar-section [class.section-hidden]="activeSection() !== 'notes'"
      [attr.aria-hidden]="activeSection() !== 'notes'"></app-general-notes-sidebar-section>
  </div>
</aside>
