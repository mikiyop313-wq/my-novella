<div class="empty-state-container">
    <div class="glow-background"></div>

            <span class="line"></span>
            <span class="dot"></span>
            <span class="line"></span>

                    <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
