<div class="card" (click)="onBookClicked()">
    <div class="card-image-wrapper">
        <img [src]="book().displayCoverImage" alt="Book Cover" class="card-image">
        <div class="card-footer">
            <button class="icon-info-btn" [appOverlayModal]="modalTemplate" #modalTrigger="appOverlayModal" (click)="$event.stopPropagation()">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#e3e3e3">
                    <path
                        d="M440-280h80v-240h-80v240Zm68.5-331.5Q520-623 520-640t-11.5-28.5Q497-680 480-680t-28.5 11.5Q440-657 440-640t11.5 28.5Q463-600 480-600t28.5-11.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
                </svg>
            </button>
        </div>
    </div>
    <div class="card-content">
        <h2 class="card-title">{{ book().title }}</h2>
        <div class="card-metadata">
            <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960" width="16px"
                fill="var(--color-text-secondary)">
                <path
                    d="M480-120q-138 0-240.5-91.5T122-440h82q14 104 92.5 172T480-200q117 0 198.5-81.5T760-480q0-117-81.5-198.5T480-760q-69 0-129 32t-101 88h110v80H120v-240h80v94q51-64 124.5-99T480-840q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-120Zm112-192L440-464v-216h80v184l128 128-56 56Z" />
            </svg>
            <span>EDITED {{ book().lastEditedAt | timeAgo }}</span>
        </div>
    </div>
</div>



<ng-template #modalTemplate let-closeModal>
    <app-book-modal [book]="book()" (close)="closeModal()" (bookDeleted)="bookDeleted.emit($event)"></app-book-modal>
</ng-template>
