<div class="search-bar-container">
    <div class="input-wrapper">
        <svg class="icon search-icon" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960"
            width="20px" fill="currentColor">
            <path
                d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
        </svg>
        <input type="text" placeholder="Find your manuscripts..." class="search-input" (input)="onSearch($event)" />
    </div>
    <button class="filter-btn" [appOverlayMenu]="filterMenuTemplate" #filterMenuTrigger="appOverlayMenu">
        <svg class="icon filter-icon" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960"
            width="20px" fill="currentColor">
            <path d="M400-240v-80h160v80H400ZM240-440v-80h480v80H240ZM120-640v-80h720v80H120Z" />
        </svg>
        <span>Order by: {{ libraryStore.orderBy() === 'name' ? 'Name' : libraryStore.orderBy() === 'lastUpdate' ? 'Last
            Update' :
            'Creation' }}</span>
    </button>
</div>

<ng-template #filterMenuTemplate let-closeMenu>
    <div class="overlay-menu">
        <button class="menu-item" [class.active-item]="libraryStore.orderBy() === 'name'"
            (click)="setOrderBy('name'); closeMenu()">
            @if (libraryStore.orderBy() === 'name') {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text)">
                <path
                    d="M424-296 254-466l56-56 114 114 400-400 56 56-456 456ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0 0v-560 560Z" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text-secondary)">
                <path
                    d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z" />
            </svg>
            }
            Name
        </button>
        <button class="menu-item" [class.active-item]="libraryStore.orderBy() === 'lastUpdate'"
            (click)="setOrderBy('lastUpdate'); closeMenu()">
            @if (libraryStore.orderBy() === 'lastUpdate') {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text)">
                <path
                    d="M424-296 254-466l56-56 114 114 400-400 56 56-456 456ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0 0v-560 560Z" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text-secondary)">
                <path
                    d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z" />
            </svg>
            }
            Last Update
        </button>
        <button class="menu-item" [class.active-item]="libraryStore.orderBy() === 'latestCreation'"
            (click)="setOrderBy('latestCreation'); closeMenu()">
            @if (libraryStore.orderBy() === 'latestCreation') {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text)">
                <path
                    d="M424-296 254-466l56-56 114 114 400-400 56 56-456 456ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0 0v-560 560Z" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text-secondary)">
                <path
                    d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z" />
            </svg>
            }
            Latest created books
        </button>

        <button class="menu-item" [class.active-item]="libraryStore.orderBy() === 'oldestCreation'"
            (click)="setOrderBy('oldestCreation'); closeMenu()">
            @if (libraryStore.orderBy() === 'oldestCreation') {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text)">
                <path
                    d="M424-296 254-466l56-56 114 114 400-400 56 56-456 456ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0 0v-560 560Z" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text-secondary)">
                <path
                    d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z" />
            </svg>
            }
            Oldest created books
        </button>
        <div class="menu-divider"></div>
        <button class="menu-item" [class.active-item]="libraryStore.showArchived()"
            (click)="toggleArchived(); closeMenu()">
            @if (libraryStore.showArchived()) {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="var(--color-text)">
                <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="transparent">
                <path d="M0 0h24v24H0z" />
            </svg>
            }
            Show Archived Books
        </button>
    </div>
</ng-template>
