<div class="page-container">
  <div class="page-header">
    <button class="back-btn" (click)="cancel()">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
        <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z" />
      </svg>
      Back to Library
    </button>
    <div class="header-titles">
      <span class="subtitle">New Masterpiece</span>
      <h1 class="title">Create your story</h1>
    </div>
  </div>

  <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="form-grid">
    <!-- Left Column -->
    <div class="form-column left-column">
      <div class="input-row">
        <div class="input-group">
          <label for="title">Title <span class="required">*</span></label>
          <input id="title" type="text" formControlName="title" placeholder="e.g. The Shadow of the Wind"
            [class.error]="bookForm.get('title')?.invalid && bookForm.get('title')?.touched">
          @if (bookForm.get('title')?.invalid && bookForm.get('title')?.touched) {
          <span class="error-msg">Title is required</span>
          }
        </div>

        <div class="input-group">
          <label for="author">Author <span class="required">*</span></label>
          <input id="author" type="text" formControlName="author" placeholder="Your name or pen name"
            [class.error]="bookForm.get('author')?.invalid && bookForm.get('author')?.touched">
          @if (bookForm.get('author')?.invalid && bookForm.get('author')?.touched) {
          <span class="error-msg">Author is required</span>
          }
        </div>
      </div>

      <div class="input-group autocomplete-group">
        <label for="language">Language</label>
        <app-autocomplete-dropdown [options]="config.languages()" [selectedValue]="bookForm.get('language')?.value"
          [grouped]="true" (selectionChange)="onSelectionChange('language', $event)">
        </app-autocomplete-dropdown>
      </div>

      <div class="input-group">
        <label for="synopsis">Synopsis</label>
        <textarea id="synopsis" formControlName="synopsis" rows="6" placeholder="What is your story about?"></textarea>
      </div>

      <div class="tags-section">
        <!-- Genres -->
        <div class="input-group autocomplete-group">
          <label>Genres & Subgenres</label>
          <app-autocomplete-dropdown [options]="genreOptions" [selectedValue]="genres.value" [multi]="true"
            [allowCustom]="false" placeholder="Select genres..."
            (selectionChange)="onSelectionChange('genre', $event)">
          </app-autocomplete-dropdown>
        </div>

        <!-- Tropes -->
        <div class="input-group autocomplete-group">
          <label>Tropes</label>
          <app-autocomplete-dropdown [options]="tropeOptions" [selectedValue]="tropes.value" [multi]="true"
            [allowCustom]="true" placeholder="Select or add tropes..."
            customAddPlaceholder="Write custom trope and press Enter..."
            (selectionChange)="onSelectionChange('trope', $event)">
          </app-autocomplete-dropdown>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="form-column right-column">
      <div class="cover-upload-section">
        <label>Cover Image</label>
        <div class="cover-upload" [class.drag-over]="isDragging" (dragover)="onDragOver($event)">
          <input type="file" id="coverUpload" (change)="onFileChange($event)" accept="image/*" hidden>
          <label for="coverUpload" class="upload-area" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">
            @if (coverPreview()) {
            <div class="preview-container">
              <img [src]="coverPreview()" alt="Cover preview" class="cover-preview">
              <button type="button" class="remove-btn" (click)="removeCoverImage($event)" title="Remove image">
                <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
                  fill="currentColor">
                  <path
                    d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                </svg>
              </button>
            </div>
            } @else {
            <div class="placeholder">
              <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px"
                fill="currentColor">
                <path
                  d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0-33-23.5-56.5T760-120H200Zm0-80h560v-560H200v560Zm40-80h480L570-480 450-320l-90-120-120 160Zm-40 80v-560 560Z" />
              </svg>
              <span>Click to upload cover</span>
              <span class="hint">Recommended: 600x900px</span>
            </div>
            }
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="bookForm.invalid || isSubmitting">
          @if (isSubmitting) {
          <span class="loader"></span>
          } @else {
          Create Novel
          }
        </button>
      </div>
    </div>
  </form>
</div>
