<div class="library-container">
    @if (libraryStore.books().length > 0) {
    <h1 class="title">The library</h1>
    <app-search-bar></app-search-bar>

    <div class="library-actions">
        <button class="add-novel-btn" (click)="onCreateBook()">
            <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px"
                fill="currentColor">
                <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
            </svg>
            <span>Add a new novel</span>
        </button>
    </div>

    <div class="library-content-wrapper">
        <div class="books-sections">
            @for (group of libraryStore.groupedBooks(); track group.label) {
            <div class="group-section" [id]="'section-' + group.label">
                <h2 class="group-header">{{ group.label }}</h2>
                <div class="books-grid">
                    @for (book of group.books; track book.id) {
                    <app-lazy-book-card class="book-card" [book]="book" (bookDeleted)="onBookDeleted($event)"></app-lazy-book-card>
                    }
                </div>
            </div>
            }
        </div>

        @if (libraryStore.indexItems().length > 1) {
        <app-index-scroll [items]="libraryStore.indexItems()" (select)="scrollToSection($event)"></app-index-scroll>
        }
    </div>
    } @else {
    <app-empty-state (onCreate)="onCreateBook()"></app-empty-state>
    }

</div>
