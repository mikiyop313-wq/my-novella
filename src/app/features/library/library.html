<div class="library-container">
  <div class="library-top-actions">
    <button
      class="library-icon-button library-import-button"
      type="button"
      aria-label="Import a My Novella archive"
      title="Import"
      [disabled]="isImportPending()"
      (click)="importArchive()"
    >
      <svg
        viewBox="0 0 512 480"
        fill="none"
        stroke="currentColor"
        stroke-width="40"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M186 51H96C71.15 51 51 71.15 51 96V405C51 429.85 71.15 450 96 450H416C440.85 450 461 429.85 461 405V144"
        ></path>
        <path d="M461 51H340C295.26 51 259 87.26 259 132V322"></path>
        <path d="M195 262L259 326L323 262"></path>
        <path d="M143 393H369"></path>
      </svg>
    </button>

    <button
      class="library-icon-button library-settings-button"
      type="button"
      aria-label="Open general settings"
      title="Settings"
      (click)="openSettings()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
        ></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>

  @if (libraryStore.books().length > 0) {
    <h1 class="title">The library</h1>
    <app-search-bar></app-search-bar>

    <div class="library-actions">
      <button class="add-novel-btn" (click)="onCreateBook()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="18px"
          viewBox="0 -960 960 960"
          width="18px"
          fill="currentColor"
        >
          <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
        </svg>
        <span>Add a new novel</span>
      </button>
    </div>

    <div class="library-content-wrapper">
      <div class="books-sections">
        @for (group of libraryStore.groupedBooks(); track group.label) {
          <div class="group-section" [id]="'section-' + group.label">
            <h2 class="group-header">{{ group.label }}</h2>
            <div class="books-grid">
              @for (book of group.books; track book.id) {
                <app-lazy-book-card
                  class="book-card"
                  [book]="book"
                  (bookDeleted)="onBookDeleted($event)"
                ></app-lazy-book-card>
              }
            </div>
          </div>
        }
      </div>

      @if (libraryStore.indexItems().length > 1) {
        <app-index-scroll
          [items]="libraryStore.indexItems()"
          (select)="scrollToSection($event)"
        ></app-index-scroll>
      }
    </div>
  } @else {
    <app-empty-state (onCreate)="onCreateBook()"></app-empty-state>
  }
</div>
