<div class="manuscript-header-node" [id]="'section-' + entityId()" [class.act-mode]="headerType() === 'act'" [class.chapter-mode]="headerType() === 'chapter'" [class.is-chapter-view]="store.mode() === 'chapter'" data-drag-handle>
  @if (headerType() === 'act') {
    <div class="act-header">
      <div class="act-number">Act {{ position() + 1 }}</div>
      <input class="act-title" [value]="title()" (input)="onTitleChange($event)" placeholder="Untitled Act">
      <div class="header-actions">
        <button class="delete-btn" (click)="deleteSection()" title="Delete Act">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        </button>
      </div>
    </div>
    <div class="elegant-divisor"></div>
  } @else {
    <div class="chapter-header">
      <div class="chapter-number">Chapter {{ position() + 1 }}</div>
      <input class="chapter-title" [value]="title()" (input)="onTitleChange($event)" placeholder="Untitled Chapter">
      <div class="header-actions">
        <button class="delete-btn" (click)="deleteSection()" title="Delete Chapter">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        </button>
      </div>
    </div>
  }
</div>
