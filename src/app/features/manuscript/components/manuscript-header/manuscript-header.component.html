<div class="manuscript-header-node" [id]="'section-' + entityId()" [class.act-mode]="headerType() === 'act'" [class.chapter-mode]="headerType() === 'chapter'" [class.is-chapter-view]="store.mode() === 'chapter'" data-drag-handle>
  @if (headerType() === 'act') {
    <div class="act-header">
      <div class="act-number">Act {{ position() + 1 }}</div>
      <input class="act-title" [value]="title()" (input)="onTitleChange($event)" placeholder="Untitled Act">
      <div class="header-actions">
        <button type="button" class="header-menu-trigger" [cdkMenuTriggerFor]="headerMenu" aria-label="Act options" title="Act options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="19" r="1"></circle>
          </svg>
        </button>
      </div>
    </div>
    <div class="elegant-divisor"></div>
  } @else {
    <div class="chapter-header">
      <div class="chapter-number">Chapter {{ position() + 1 }}</div>
      <input class="chapter-title" [value]="title()" (input)="onTitleChange($event)" placeholder="Untitled Chapter">
      <div class="header-actions">
        <button type="button" class="header-menu-trigger" [cdkMenuTriggerFor]="headerMenu" aria-label="Chapter options" title="Chapter options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="19" r="1"></circle>
          </svg>
        </button>
      </div>
    </div>
  }
</div>

<ng-template #headerMenu>
  <div class="overlay-menu manuscript-header-menu" cdkMenu>
    <button class="menu-item" cdkMenuItem (click)="archiveSection()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="5" rx="2"></rect>
        <path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"></path>
        <path d="M10 13h4"></path>
      </svg>
      Archive {{ headerType() }}
    </button>
    <button class="menu-item delete" cdkMenuItem (click)="deleteSection()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"></path>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
      Delete {{ headerType() }}
    </button>
  </div>
</ng-template>
