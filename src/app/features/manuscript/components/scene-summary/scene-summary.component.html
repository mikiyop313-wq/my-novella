<div class="scene-summary-node">
  <div class="summary-header" (click)="toggleCollapse()">
    <div class="summary-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="summary-icon">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>Scene Summary</span>
    </div>
    <div class="summary-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron" [class.expanded]="!isCollapsed()">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>

  <div class="summary-content-wrapper" [class.collapsed]="isCollapsed()">
    <div class="summary-content-inner">
      <div 
        class="summary-editable-content" 
        #editableDiv 
        contenteditable="true" 
        [attr.data-placeholder]="'Add a summary...'"
        (input)="onInput($event)"
        (paste)="onPaste($event)"
        (keydown.enter)="$event.stopPropagation()"
      ></div>
    </div>
  </div>
</div>
