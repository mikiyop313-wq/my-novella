<div class="scrollbar-track" (pointerdown)="onTrackPointerDown($event)">
  <!-- The draggable/scroll indicative thumb -->
  <div class="scrollbar-thumb" 
       [style.top.%]="thumbTop()" 
       [style.height.%]="thumbHeight()"
       [class.dragging]="isDragging()"
       (pointerdown)="onThumbPointerDown($event)"
       (pointermove)="onThumbPointerMove($event)"
       (pointerup)="onThumbPointerUp($event)"
       (pointercancel)="onThumbPointerUp($event)">
  </div>

  <!-- The proportional markers -->
  @for (posItem of positionedItems(); track posItem.item.id) {
    <div class="scrollbar-marker" 
         [style.top.%]="posItem.topPercent"
         [class.active]="isActive(posItem.item)" 
         [class.type-act]="posItem.item.type === 'act'"
         [class.type-chapter]="posItem.item.type === 'chapter'"
         [class.type-scene]="posItem.item.type === 'scene'"
         (click)="onItemClick(posItem.item)">
      
      <div class="marker-line"></div>
      
      <div class="marker-tooltip">
        {{ posItem.item.label }}
      </div>
    </div>
  }
</div>
