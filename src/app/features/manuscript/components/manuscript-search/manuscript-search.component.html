<section class="manuscript-search-widget" role="search" aria-label="Find in manuscript">
  <div class="search-row">
    <input #searchInput type="text" autocomplete="off" spellcheck="false" aria-label="Search manuscript prose"
      placeholder="Find in manuscript" [value]="query()" (input)="onInput($event)"
      (keydown)="onInputKeydown($event)">

    <span class="match-count" aria-live="polite">
      @if (loading()) { … } @else { {{ currentMatch() }}/{{ totalMatches() }} }
    </span>

    <button type="button" class="icon-button" title="Previous match (Shift+Enter)" aria-label="Previous match"
      [disabled]="totalMatches() === 0 || loading()" (click)="previous.emit()">↑</button>
    <button type="button" class="icon-button" title="Next match (Enter)" aria-label="Next match"
      [disabled]="totalMatches() === 0 || loading()" (click)="next.emit()">↓</button>
    <button type="button" class="icon-button close-button" title="Close (Escape)" aria-label="Close search"
      (click)="closed.emit()">×</button>
  </div>

  <div class="option-row">
    <button type="button" class="scope-button" [class.active]="wholeManuscript()"
      [attr.aria-pressed]="wholeManuscript()" (click)="wholeManuscriptChange.emit(!wholeManuscript())">
      Whole manuscript
    </button>
    <button type="button" class="option-button" title="Match case" aria-label="Match case"
      [class.active]="matchCase()" [attr.aria-pressed]="matchCase()"
      (click)="matchCaseChange.emit(!matchCase())">Aa</button>
    <button type="button" class="option-button" title="Match whole word" aria-label="Match whole word"
      [class.active]="wholeWord()" [attr.aria-pressed]="wholeWord()"
      (click)="wholeWordChange.emit(!wholeWord())">Word</button>
  </div>

  @if (error()) {
  <div class="search-error" role="alert">
    <span>{{ error() }}</span>
    <button type="button" (click)="retry.emit()">Retry</button>
  </div>
  }
</section>
