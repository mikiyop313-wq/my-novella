@if (selectedGeneration(); as generation) {
<section
  class="prose-generation-widget"
  role="button"
  tabindex="0"
  [attr.aria-label]="'Show prose generation in ' + generation.breadcrumb"
  (click)="requestFocus()"
  (keydown.enter)="requestFocus()"
  (keydown.space)="$event.preventDefault(); requestFocus()">
  <div class="generation-main-row">
    <button
      class="generation-stop-button"
      type="button"
      aria-label="Stop this prose generation"
      title="Stop generation"
      (click)="stopSelected($event)">
      <span aria-hidden="true"></span>
    </button>

    <div class="generation-word-count" aria-live="polite">
      <strong>{{ generation.wordCount }}</strong>
      <span>{{ generation.wordCount === 1 ? 'word' : 'words' }}</span>
    </div>

    <div class="generation-details">
      <span class="generation-eyebrow">Generating prose</span>
      <span class="generation-location" [title]="generation.breadcrumb">
        {{ generation.breadcrumb }}
      </span>
    </div>
  </div>

  @if (hasMultipleGenerations()) {
  <div class="generation-navigation" aria-label="Prose generation navigation">
    <button
      type="button"
      aria-label="Previous prose generation"
      [disabled]="!canSelectPrevious()"
      (click)="selectPrevious($event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <span>{{ selectedIndex() + 1 }} / {{ generations().length }}</span>

    <button
      type="button"
      aria-label="Next prose generation"
      [disabled]="!canSelectNext()"
      (click)="selectNext($event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>
  }
</section>
}
