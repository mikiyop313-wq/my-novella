<section class="paragraph-review-modal overlay-modal" role="dialog" aria-modal="true"
  aria-labelledby="paragraph-review-title">
  @if (currentItem(); as item) {
    <header class="modal-header">
      <div class="title-group" [class]="itemAnimationClass()">
        <span class="eyebrow">Semantic manuscript context</span>
        <h2 id="paragraph-review-title">Review paragraph</h2>
        <p class="location-label">{{ item.location }}</p>
      </div>
      <button type="button" class="icon-button close-button" aria-label="Finish paragraph review"
        (click)="close.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </header>

    <div class="modal-body" [class]="itemAnimationClass()">
      <p>{{ item.result.text }}</p>
    </div>

    <footer class="modal-footer">
      <div class="item-navigation">
        <button type="button" class="icon-button navigation-button" aria-label="Previous paragraph"
          [disabled]="currentIndex() === 0" (click)="previous()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <span class="item-count" aria-live="polite">
          <strong>{{ currentIndex() + 1 }}</strong> / {{ items().length }}
        </span>
        <button type="button" class="icon-button navigation-button" aria-label="Next paragraph"
          [disabled]="currentIndex() === items().length - 1" (click)="next()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" class="action-button reject-button" (click)="reject()">Reject</button>
        <button type="button" class="action-button accept-button" (click)="accept()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>
          Accept
        </button>
      </div>
    </footer>
  }
</section>
