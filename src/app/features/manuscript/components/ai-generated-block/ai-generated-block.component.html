<div class="ai-generated-container" [class.is-loading]="isLoading()">
  <!-- Model metadata -->
  <div class="ai-header" contenteditable="false">
    @if(modelId()) {
    <div class="ai-model-badge">
      <span>{{ modelId() }}</span>
    </div>
    }
  </div>

  <!-- Reasoning output -->
  @if(reasoningText()){
  <div class="reasoning-block" contenteditable="false">
    <div class="reasoning-header" (click)="toggleReasoning()" title="Toggle Thinking Process">
      <svg [class.expanded]="isReasoningExpanded()" viewBox="0 0 24 24" width="16" height="16" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
      <span class="reasoning-title">Thinking Process</span>
    </div>

    @if(isReasoningExpanded()){
    <div class="reasoning-content">
      {{ reasoningText() }}
    </div>
    }
  </div>
  }

  <!-- Generated manuscript content -->
  <div class="ai-generated-content" [class.is-generating]="isGenerating()" #contentDOM data-node-view-content></div>

  <!-- Live word count -->
  @if(wordCount() > 0){
  <div class="word-count-row" contenteditable="false">
    <span class="word-count-badge" [class.is-live]="isLoading()">
      @if(isLoading()){
      <span class="live-dot"></span>
      }
      {{ wordCount() }} {{ wordCount() === 1 ? 'word' : 'words' }}
    </span>
  </div>
  }

  <!-- Review actions -->
  @if(!isLoading()){
  <div class="ai-post-actions" contenteditable="false">
    <div class="main-actions" *ngIf="!isModifying()">
      <button class="action-btn discard" (click)="discardText()" title="Discard text">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Discard
      </button>

      <button class="action-btn copy" (click)="copyText()" title="Copy to clipboard">
        @if(hasCopied()) {
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Copied!
        } @else {
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copy
        }
      </button>

      <button class="action-btn retry" (click)="tryAgain()" title="Try again">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Try Again
      </button>

      <button class="action-btn modify" (click)="toggleModify()" title="Tell AI what to change">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
        Modify
      </button>

      <button class="action-btn apply" (click)="applyText()" title="Apply to manuscript">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Apply
      </button>
    </div>

    <!-- Modification request form -->
    @if(isModifying()){
    <div class="modify-actions">
      <input type="text" class="modify-input" [(ngModel)]="modifyPrompt" placeholder="Tell AI what to change..."
        (keydown.enter)="submitModify()">

      <div class="modify-btns">
        <button class="action-btn outline" (click)="toggleModify()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Cancel
        </button>

        <button class="action-btn apply" (click)="submitModify()" [disabled]="!modifyPrompt().trim()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          Update
        </button>
      </div>
    </div>
    }
  </div>
  }
</div>
