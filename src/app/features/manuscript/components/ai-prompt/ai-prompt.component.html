<div class="ai-prompt-wrapper" [class.focused]="isFocused()">
  <div class="ai-prompt-card">
    <div class="card-bg-glow"></div>

    <!-- Card Header -->
    <div class="card-header">
      <div class="header-title">
        <svg data-drag-handle style="cursor: grab;" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path
            d="M360-160q-33 0-56.5-23.5T280-240q0-33 23.5-56.5T360-320q33 0 56.5 23.5T440-240q0 33-23.5 56.5T360-160Zm240 0q-33 0-56.5-23.5T520-240q0-33 23.5-56.5T600-320q33 0 56.5 23.5T680-240q0 33-23.5 56.5T600-160ZM360-400q-33 0-56.5-23.5T280-480q0-33 23.5-56.5T360-560q33 0 56.5 23.5T440-480q0 33-23.5 56.5T360-400Zm240 0q-33 0-56.5-23.5T520-480q0-33 23.5-56.5T600-560q33 0 56.5 23.5T680-480q0 33-23.5 56.5T600-400ZM360-640q-33 0-56.5-23.5T280-720q0-33 23.5-56.5T360-800q33 0 56.5 23.5T440-720q0 33-23.5 56.5T360-640Zm240 0q-33 0-56.5-23.5T520-720q0-33 23.5-56.5T600-800q33 0 56.5 23.5T680-720q0 33-23.5 56.5T600-640Z" />
        </svg>
        <span class="title-text">AI Writer Assistant</span>
      </div>
      <div class="header-actions">
        @if (promptText()) {
        <button class="clear-btn" (click)="clearPrompt()" title="Clear text">Clear</button>
        }
        <button class="remove-btn" (click)="removePrompt()" title="Remove Prompt">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Prompt Input Body -->
    <div class="card-body">
      <div class="prompt-textarea" #promptInput contenteditable="true" (input)="onInput($event)" (focus)="onFocus()"
        (blur)="onBlur()"
        data-placeholder="Ask AI to write, brainstorm, or refine. Try: 'Write a suspenseful scene...'"></div>
    </div>

    <!-- Actions Footer -->
    <div class="card-footer">
      <!-- Left side: Send button with dropdown menu -->
      <div class="footer-left">
        <div class="split-btn-group" [class.has-content]="promptText().trim().length > 0">
          <button class="submit-btn" [disabled]="!promptText().trim()" (click)="onSubmit()" title="Send Prompt">
            <span class="model-name">{{ selectedModel() || 'No model selected' }}</span>
            <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>

          <div class="btn-divider"></div>

          <button class="dropdown-btn" [cdkMenuTriggerFor]="modelsMenu" title="Select Model">
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>

        <ng-template #modelsMenu>
          <div class="dropdown-menu models-menu" cdkMenu>
            <div class="menu-empty-state" cdkMenuItem disabled>
              No models available
            </div>
          </div>
        </ng-template>
      </div>

      <!-- Right side: Advanced settings modal -->
      <div class="footer-right">
        <button class="settings-btn" [appOverlayModal]="settingsModalTemplate" title="Advanced Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" width="18" height="18">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
        </button>

        <ng-template #settingsModalTemplate let-closeModal>
          <div class="settings-modal-content overlay-modal">
            <div class="modal-header">
              <h3>Advanced Novel Settings</h3>
              <button class="close-modal-btn" (click)="closeModal()">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <div class="modal-body">
              <div class="empty-state">
                <p>No advanced settings available yet.</p>
              </div>
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
