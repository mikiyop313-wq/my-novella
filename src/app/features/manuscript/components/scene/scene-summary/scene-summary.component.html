<div class="scene-node-container" [id]="'section-' + entityId()">
  @if (showDivisor()) {
    <div class="scene-divisor">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="100">
        <defs>
          <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0" />
            <stop offset="100%" stop-color="currentColor" stop-opacity="1" />
          </linearGradient>
          <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="currentColor" stop-opacity="1" />
            <stop offset="100%" stop-color="currentColor" stop-opacity="0" />
          </linearGradient>
        </defs>
        <rect x="50" y="49" width="380" height="2" fill="url(#fadeLeft)" rx="1" />
        <rect x="570" y="49" width="380" height="2" fill="url(#fadeRight)" rx="1" />
        <g transform="translate(500, 50)" fill="currentColor">
          <circle cx="0" cy="0" r="24" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="0" cy="0" r="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3" />
          <path d="M 0 -10 L 10 0 L 0 10 L -10 0 Z" />
          <path d="M -24 0 C -35 -16 -55 -10 -60 0 C -55 10 -35 16 -24 0" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="-42" cy="0" r="2.5" />
          <path d="M 24 0 C 35 -16 55 -10 60 0 C 55 10 35 16 24 0" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="42" cy="0" r="2.5" />
          <circle cx="-70" cy="0" r="2" />
          <circle cx="70" cy="0" r="2" />
        </g>
      </svg>
    </div>
  }

  <div class="scene-title-display" [class.is-hidden]="!store.showSceneTitles()">
    <div 
      class="scene-title-editable" 
      #titleEditableDiv 
      contenteditable="true" 
      [attr.data-placeholder]="'untitled'"
      (input)="onTitleInput($event)"
      (paste)="onPaste($event)"
      (keydown.enter)="$event.stopPropagation()"
    ></div>
  </div>

  <div class="scene-summary-gutter-node" [class.is-hidden]="!store.showSummaries()">
    <div class="summary-header">
      <div class="summary-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="summary-icon">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Scene Summary</span>
      </div>
      <button
        type="button"
        class="summary-menu-trigger"
        [cdkMenuTriggerFor]="sceneSummaryMenu"
        aria-label="Scene options"
        title="Scene options"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="5" r="1"></circle>
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="12" cy="19" r="1"></circle>
        </svg>
      </button>
    </div>

    <div class="summary-content-wrapper">
      <app-markdown-editor
        class="summary-markdown-editor"
        [value]="summary()"
        placeholder="Add a summary..."
        ariaLabel="Scene summary"
        (valueChange)="onSummaryChange($event)"
        (keydown.enter)="$event.stopPropagation()"
      ></app-markdown-editor>
    </div>
  </div>
</div>

<ng-template #sceneSummaryMenu>
  <div class="overlay-menu scene-summary-menu" cdkMenu>
    <button
      class="menu-item"
      cdkMenuItem
      [cdkMenuItemDisabled]="isAiSummaryDisabled()"
      [disabled]="isAiSummaryDisabled()"
      [title]="hasSceneProse() ? 'Generate scene summary' : 'Add scene prose before generating a summary'"
      (click)="generateAiSummary()"
    >
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"></path>
      </svg>
      @if (isGeneratingSummary()) { Generating... } @else { AI summary }
    </button>
    <button class="menu-item" cdkMenuItem (click)="archiveScene()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="5" rx="2"></rect>
        <path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"></path>
        <path d="M10 13h4"></path>
      </svg>
      Archive scene
    </button>
    <button class="menu-item delete" cdkMenuItem (click)="deleteScene()">
      <svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"></path>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
      Delete scene
    </button>
  </div>
</ng-template>
