<div class="slash-command-menu" role="menu" aria-label="Manuscript commands" (mousedown)="preventEditorBlur($event)">
  <section class="command-section" aria-labelledby="ai-command-heading">
    <div id="ai-command-heading" class="section-label">AI Prose Generation</div>
    <button id="slash-command-ai" class="command-item" type="button" role="menuitem"
      [class.selected]="selectedIndex() === 0" (click)="select('ai')">
      <span class="command-icon ai-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.15 3.1a4.4 4.4 0 0 0 2.6 2.6L19 10l-3.25 1.3a4.4 4.4 0 0 0-2.6 2.6L12 17l-1.15-3.1a4.4 4.4 0 0 0-2.6-2.6L5 10l3.25-1.3a4.4 4.4 0 0 0 2.6-2.6L12 3Z" />
          <path d="M19 15l.55 1.45A2.5 2.5 0 0 0 21 18l-1.45.55A2.5 2.5 0 0 0 18 20l-.55-1.45A2.5 2.5 0 0 0 16 17l1.45-.55A2.5 2.5 0 0 0 19 15Z" />
        </svg>
      </span>
      <span class="command-copy">
        <span class="command-title">{{ items[0].title }}</span>
        <span class="command-description">{{ items[0].description }}</span>
      </span>
      <span class="enter-hint" aria-hidden="true">↵</span>
    </button>
  </section>

  <div class="section-divider"></div>

  <section class="command-section" aria-labelledby="structure-command-heading">
    <div id="structure-command-heading" class="section-label">Create Structure</div>
    @for (item of items.slice(1); track item.command; let index = $index) {
    <button [id]="'slash-command-' + item.command" class="command-item" type="button" role="menuitem"
      [class.selected]="selectedIndex() === index + 1" (click)="select(item.command)">
      <span class="command-icon" aria-hidden="true">
        @switch (item.command) {
          @case ('chapter') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" />
            <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20" />
          </svg>
          }
          @case ('act') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20V6l8-3 8 3v14" />
            <path d="M8 20v-6h8v6M8 8h.01M12 8h.01M16 8h.01M8 11h.01M12 11h.01M16 11h.01" />
          </svg>
          }
          @case ('scene') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 9 18 0M8 5l3 4M14 5l3 4" />
          </svg>
          }
        }
      </span>
      <span class="command-copy">
        <span class="command-title">{{ item.title }}</span>
        <span class="command-description">{{ item.description }}</span>
      </span>
    </button>
    }
  </section>

  <div class="menu-footer" aria-hidden="true">
    <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
    <span><kbd>Enter</kbd> Select</span>
    <span><kbd>Esc</kbd> Close</span>
  </div>
</div>
