<main class="main" [class.is-animating]="isAnimating()">
  <div class="animation-container" [@routeAnimations]="getRouteAnimationData()"
       (@routeAnimations.start)="onAnimationStart($event)"
       (@routeAnimations.done)="onAnimationDone($event)">
    <router-outlet />
  </div>

  <app-confirm-modal></app-confirm-modal>
  <app-toast-container></app-toast-container>
</main>
