@if (confirmService.state().show) {
  <div class="confirm-modal-backdrop" (click)="confirmService.state().onCancel()">
    <div class="confirm-modal" (click)="$event.stopPropagation()">
      <div class="confirm-modal-header">
        <h3>{{ confirmService.state().title }}</h3>
      </div>
      <div class="confirm-modal-body">
        <p>{{ confirmService.state().message }}</p>
        @if (confirmService.state().checkboxLabel; as checkboxLabel) {
          <label class="confirm-modal-checkbox">
            <input
              type="checkbox"
              [checked]="confirmService.state().checkboxChecked"
              (change)="updateCheckbox($event)"
            />
            <span>{{ checkboxLabel }}</span>
          </label>
        }
      </div>
      <div class="confirm-modal-actions">
        <button type="button" class="btn-cancel" (click)="confirmService.state().onCancel()">
          Cancel
        </button>
        <button type="button" class="btn-confirm" (click)="confirmService.state().onConfirm()">
          {{ confirmService.state().confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
