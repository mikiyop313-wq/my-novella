<div class="info-icon-container" 
     [style.width.px]="size" 
     [style.height.px]="size"
     [appOverlayInfoDirective]="infoContent">
  <svg 
    viewBox="0 0 24 24" 
    fill="none" 
    [attr.stroke]="color" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M12 16v-4"></path>
    <path d="M12 8h.01"></path>
  </svg>
</div>

<ng-template #infoContent let-close="close">
<div class="info-overlay-card">
    @if (infoTemplate) {
      <ng-container [ngTemplateOutlet]="infoTemplate" [ngTemplateOutletContext]="{ $implicit: close }"></ng-container>
    } @else {
      <div class="info-content" [innerHTML]="infoText"></div>
    }
  </div>
</ng-template>
